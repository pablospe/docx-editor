codecov:
  notify:
    # The 3.11 job runs as two shards, each uploading a partial report.
    after_n_builds: 2

coverage:
  range: 70..100
  round: down
  precision: 1
  status:
    project:
      default:
        target: 90%
        threshold: 0.5%

ignore:
  # Typed base for the RevisionManager mixins: its stub bodies are overridden by construction.
  - docx_editor/track_changes/base.py
